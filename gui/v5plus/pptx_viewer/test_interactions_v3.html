<!DOCTYPE html>
<html lang="zh-CN" style="height:100%;width:100%">
<head>
<meta charset="UTF-8">
<title>pptx-renderer 交互验证 v3 - Overlay 方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#1e1e1e; color:#d4d4d4; }
  #toolbar { height:40px; background:#2d2d2d; display:flex; align-items:center; padding:0 12px; gap:8px; border-bottom:1px solid #3c3c3c; }
  #toolbar button { background:#3c3c3c; color:#d4d4d4; border:1px solid #555; border-radius:4px; padding:4px 12px; cursor:pointer; font-size:12px; }
  #toolbar button:hover { background:#4c4c4c; }
  #toolbar button.active { background:#007bff; border-color:#007bff; }
  #toolbar .info { color:#aaa; font-size:11px; margin-left:auto; }
  #main { display:flex; height:calc(100% - 40px); }
  #viewer-wrap { flex:1; overflow:auto; padding:16px; position:relative; }
  #viewer { position:relative; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100000; }
  #overlay .ix-box { position:absolute; pointer-events:auto; cursor:pointer; border:2px solid transparent; transition:border-color 0.15s, background-color 0.15s; }
  #overlay .ix-box:hover { border-color: rgba(0,123,255,0.6); background-color: rgba(0,123,255,0.08); }
  #overlay .ix-box.selected { border-color: #007bff; background-color: rgba(0,123,255,0.12); box-shadow: 0 0 8px rgba(0,123,255,0.3); }
  #overlay .ix-box.editing { border-color: #28a745; background-color: rgba(40,167,69,0.1); }
  #overlay .ix-box.dragging { opacity:0.9; border-color: #007bff; background-color: rgba(0,123,255,0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index:100001; }
  #overlay .ix-box .resize-handle { position:absolute; bottom:-4px; right:-4px; width:8px; height:8px; background:#007bff; border-radius:50%; display:none; }
  #overlay .ix-box.selected .resize-handle { display:block; }
  #sidebar { width:260px; background:#252526; border-left:1px solid #3c3c3c; padding:12px; overflow:auto; font-size:12px; }
  #sidebar h3 { color:#ccc; margin-bottom:8px; font-size:13px; }
  #sidebar .prop { margin-bottom:8px; }
  #sidebar label { display:block; color:#888; margin-bottom:2px; }
  #sidebar input, #sidebar textarea { width:100%; background:#1e1e1e; color:#d4d4d4; border:1px solid #3c3c3c; border-radius:3px; padding:4px 6px; font-size:12px; }
  #sidebar textarea { height:60px; resize:vertical; }
  #status { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:white; padding:20px 40px; border-radius:8px; font-size:14px; display:none; z-index:100; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btn-select" class="active" onclick="setMode('select')">🖱 选择</button>
  <button id="btn-drag" onclick="setMode('drag')">✋ 拖拽</button>
  <button id="btn-edit" onclick="setMode('edit')">✏ 编辑</button>
  <button onclick="dumpDOM()">🔍 DOM</button>
  <span class="info" id="info">等待加载...</span>
</div>
<div id="main">
  <div id="viewer-wrap">
    <div id="viewer"></div>
    <div id="overlay"></div>
  </div>
  <div id="sidebar">
    <h3>属性面板</h3>
    <div id="props"><p style="color:#666">点击元素查看属性</p></div>
    <h3 style="margin-top:12px">验证日志</h3>
    <div id="log" style="color:#888;font-family:monospace;font-size:10px;white-space:pre-wrap;max-height:400px;overflow:auto;"></div>
  </div>
</div>
<div id="status">加载中...</div>

<script src="pptx-bundle.js"></script>
<script>
const PptxViewer = window._PptxViewer;
const LIMITS = window._RECOMMENDED_ZIP_LIMITS;
const viewer = document.getElementById('viewer');
const overlay = document.getElementById('overlay');
const info = document.getElementById('info');
const statusEl = document.getElementById('status');
const propsEl = document.getElementById('props');
const logEl = document.getElementById('log');
let viewer_inst = null, buf = null, mode = 'select', sel = null;
let ixBoxes = []; // { el, box, target }

function log(m) { logEl.textContent += m + '\n'; logEl.scrollTop = 99999; console.log('[ix]', m); }
function setMode(m) {
  mode = m;
  document.querySelectorAll('#toolbar button[id]').forEach(b => b.classList.remove('active'));
  const b = document.getElementById('btn-'+m); if(b) b.classList.add('active');
  log('mode=' + m);
}

// ── DOM 检查 ──
function dumpDOM() {
  let out = '=== viewer DOM ===\n';
  function walk(el, depth) {
    if (depth > 5) return;
    const tag = el.tagName?.toLowerCase() || '?';
    const cls = el.className ? '.' + String(el.className).split(' ').slice(0,2).join('.') : '';
    const w = el.offsetWidth, h = el.offsetHeight;
    const pos = getComputedStyle(el).position;
    const children = el.children.length;
    if (w > 5 && h > 5) {
      out += '  '.repeat(depth) + `<${tag}${cls}> ${w}×${h} pos:${pos} ch:${children}\n`;
    }
    for (const c of el.children) walk(c, depth+1);
  }
  walk(viewer, 0);
  log(out);
}

// ── 渲染 ──
async function loadPptx(ab) {
  statusEl.textContent = '渲染中...'; statusEl.style.display = 'block';
  try {
    if (viewer_inst) { viewer_inst.destroy(); viewer_inst = null; }
    viewer.innerHTML = '';
    overlay.innerHTML = '';
    ixBoxes = [];
    buf = ab;
    viewer_inst = await PptxViewer.open(ab, viewer, { zipLimits: LIMITS, listOptions: { windowed: false } });
    statusEl.style.display = 'none';
    const n = viewer_inst.slideCount || viewer.children.length;
    info.textContent = `渲染完成 ${n} 页`;
    log('rendered ' + n + ' slides');
    dumpDOM();
    setTimeout(installOverlay, 500);
  } catch(e) {
    statusEl.textContent = 'ERROR: ' + e.message; log('ERROR: ' + e.message + '\n' + e.stack);
  }
}

// ── 安装 overlay 交互层 ──
function installOverlay() {
  overlay.innerHTML = '';
  ixBoxes = [];
  const all = viewer.querySelectorAll('*');
  let count = 0;
  for (const el of all) {
    const r = el.getBoundingClientRect();
    if (r.width < 30 || r.height < 15 || el === viewer) continue;
    const pos = getComputedStyle(el).position;
    const hasText = el.textContent?.trim().length > 0;
    const hasImg = el.tagName === 'IMG' || el.tagName === 'SVG' || el.tagName === 'CANVAS' || el.tagName === 'TABLE';
    const isShape = pos === 'absolute';
    const isLeaf = hasText && el.children.length === 0;
    const isTable = el.tagName === 'TABLE' || hasImg;
    if (!isShape && !isLeaf && !isTable) continue;
    if (el._ixId) continue;
    
    const id = 'ix-' + count;
    el._ixId = id;
    
    // 创建 overlay 框
    const box = document.createElement('div');
    box.className = 'ix-box';
    box.dataset.ixId = id;
    box.style.left = r.left + 'px';
    box.style.top = r.top + 'px';
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
    
    // 右下角 resize 手柄
    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    box.appendChild(handle);
    
    overlay.appendChild(box);
    ixBoxes.push({ el, box, id, origRect: { left: r.left, top: r.top, width: r.width, height: r.height } });
    
    // 事件绑定到 overlay 框上
    box.addEventListener('mouseenter', () => {
      if (box !== sel?.box) box.classList.add('hover');
    });
    box.addEventListener('mouseleave', () => {
      box.classList.remove('hover');
    });
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      selectBox(box, el);
    });
    box.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startEdit(box, el);
    });
    box.addEventListener('mousedown', (e) => {
      if (e.detail >= 2) return;
      const sx = e.clientX, sy = e.clientY;
      const startLeft = parseFloat(box.style.left);
      const startTop = parseFloat(box.style.top);
      let moved = false;
      
      const onMove = (e2) => {
        const dx = e2.clientX - sx, dy = e2.clientY - sy;
        if (!moved && Math.abs(dx)+Math.abs(dy) < 5) return;
        if (!moved) {
          moved = true;
          box.classList.add('dragging');
        }
        box.style.left = (startLeft + dx) + 'px';
        box.style.top = (startTop + dy) + 'px';
        e2.preventDefault();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        box.classList.remove('dragging');
        if (moved) {
          log('dragged: "' + el.textContent?.trim().substring(0,30) + '"');
          selectBox(box, el);
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    
    count++;
  }
  log('installed overlay interactions on ' + count + ' elements');
  
  // 点击空白取消选中
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) deselect();
  });
}

// 重新同步 overlay 位置（窗口 resize/滚动时）
function syncOverlay() {
  for (const { el, box } of ixBoxes) {
    const r = el.getBoundingClientRect();
    const wrapR = document.getElementById('viewer-wrap').getBoundingClientRect();
    box.style.left = (r.left - wrapR.left) + 'px';
    box.style.top = (r.top - wrapR.top) + 'px';
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
  }
}
window.addEventListener('resize', syncOverlay);

function selectBox(box, el) {
  deselect();
  sel = { box, el };
  box.classList.add('selected');
  const r = el.getBoundingClientRect();
  const text = (el.textContent || '').trim().substring(0, 150);
  const tag = el.tagName.toLowerCase();
  propsEl.innerHTML = `
    <div class="prop"><label>标签</label><input value="<${tag}>" readonly></div>
    <div class="prop"><label>尺寸</label><input value="${Math.round(r.width)}×${Math.round(r.height)}" readonly></div>
    <div class="prop"><label>定位</label><input value="${getComputedStyle(el).position}" readonly></div>
    <div class="prop"><label>内容</label><textarea id="et">${text}</textarea></div>
    <button onclick="applyEdit()" style="margin-top:4px;background:#007bff;color:white;border:none;border-radius:3px;padding:4px 12px;cursor:pointer;font-size:12px;">应用</button>
  `;
  log('selected: <'+tag+'> "'+text.substring(0,40)+'"');
}

function deselect() {
  if (sel) {
    sel.box.classList.remove('selected', 'editing');
    if (sel.box.isContentEditable) sel.box.contentEditable = 'false';
    sel = null;
  }
}

function startEdit(box, el) {
  deselect();
  sel = { box, el };
  box.classList.add('editing');
  // 将 overlay 框变成可编辑：显示 el 的内容
  box.innerHTML = '<div style="width:100%;height:100%;outline:none;" contenteditable="true">' + escapeHtml(el.textContent || '') + '</div>';
  const editor = box.querySelector('[contenteditable]');
  editor.focus();
  log('editing: "' + el.textContent?.trim().substring(0,40) + '"');
  editor.addEventListener('blur', () => {
    const newText = editor.textContent;
    el.textContent = newText;
    box.classList.remove('editing');
    // 恢复 resize 手柄
    box.innerHTML = '<div class="resize-handle"></div>';
    log('edit done: "' + newText.substring(0,40) + '"');
  }, {once:true});
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function applyEdit() {
  const ta = document.getElementById('et');
  if (!ta || !sel) return;
  sel.el.textContent = ta.value;
  log('applied: "' + ta.value.substring(0,40) + '"');
}

window.loadPptx = loadPptx;
if (typeof QWebChannel !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, ch => { window.pyBridge = ch.objects.pyBridge; });
}
log('ready');
</script>
</body>
</html>
